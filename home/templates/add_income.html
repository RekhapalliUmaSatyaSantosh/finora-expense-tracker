{% extends 'base.html' %}
{% block title %}Add Income | Finora{% endblock %}
{% block content %}
<div class="category-container">
    <h1>Add Income</h1>
    {% if error %}
        <p class="budget-error">{{ error }}</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <label>Income Source</label>
        <input type="text" name="source" placeholder="e.g. Salary" required>
        <label>Amount (₹)</label>
        <input type="number" name="amount" min="0.01" step="0.01" required>
        <label>Description (optional)</label>
        <input type="text" name="description" placeholder="Add details">
        <label>Date Received</label>
        <input type="date" name="date" required>
        <button type="submit">Save Income</button>
    </form>
</div>
{% endblock content %}
