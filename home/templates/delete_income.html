{% extends 'base.html' %}
{% block title %}Delete Income | Finora{% endblock %}
{% block content %}
<div class="category-container">
    <h1>Delete Income</h1>
    <p>Are you sure you want to delete<strong>{{ income.source }}</strong>— ₹{{ income.amount }}?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
        <a href="{% url 'income_list' %}">Cancel</a>
    </form>
</div>
{% endblock content %}
