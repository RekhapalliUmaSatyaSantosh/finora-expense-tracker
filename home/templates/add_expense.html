{% extends 'base.html' %}
{% block title %}Add Expense | Finora{% endblock %}
{% block content %}
<div class="category-container">
    <h1>Add Expense</h1>
    <p>Record your daily spending.</p>
    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <label for="description">Expense Name / Description</label>
        <input type="text" id="description" name="description" placeholder="Example: Lunch" maxlength="200" required>
        <label for="amount">Amount (₹)</label>
        <input type="number" id="amount" name="amount" placeholder="Enter amount" min="0.01" step="0.01" require>
        <label for="category">Category</label>
        <select id="category" name="category" required>
            <option value="">Select a category</option>
            {% for category in categories %}
                <option value="{{ category.id }}">
                    {{ category.name }}
                </option>
            {% endfor %}
        </select>
        <label for="date">Expense Date</label>
        <input type="date" id="date" name="date" required>
        <label for="payment_method">Payment Method</label>
        <select id="payment_method" name="payment_method" required>
            <option value="">Select payment method</option>
            <option value="Cash">Cash</option>
            <option value="UPI">UPI</option>
            <option value="Debit Card">Debit Card</option>
            <option value="Credit Card">Credit Card</option>
            <option value="Bank Transfer">Bank Transfer</option>
        </select>
        <button type="submit">Save Expense</button>
    </form>
</div>
{% endblock content %}
