{% extends 'base.html' %}
{% block title %}Edit Income | Finora{% endblock %}
{% block content %}
<div class="category-container">
    <h1>Edit Income</h1>
    {% if error %}
        <p class="budget-error">{{ error }}</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <label>Income Source</label>
        <input type="text" name="source" value="{{ income.source }}" required>
        <label>Amount (₹)</label>
        <input type="number" name="amount" value="{{ income.amount }}" min="0.01" step="0.01" required>
        <label>Description</label>
        <input type="text" name="description" value="{{ income.description }}">
        <label>Date</label>
        <input type="date" name="date" value="{{ income.date|date:'Y-m-d' }}" required>
        <button type="submit">Update Income</button>
    </form>
</div>
{% endblock content %}
